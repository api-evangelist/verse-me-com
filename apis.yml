- aid: verse-me-com:verse-expertise-api
  name: Verse Expertise API
  description: >-
    The REST paths the agent card names on api.verse-me.com, with no OpenAPI behind them: free reads GET
    /expertise/calibration, /expertise/calibration/signed, /expertise/calibration/history (+ /signed) and
    /reputation, a free POST /expertise/consultation/price-estimate, and paid POSTs /expertise/consultation,
    /expertise/epistemic-audit and /expertise/edgar that return 402 and are paid in USDC on Base via x402, then retried
    with the payment receipt. Answers carry an Ed25519 signature over canonical JSON. No idempotency, refund, rate
    limit or error reference is published. Every one of these paths — including the ones the card calls free and
    public — answered a Cloudflare managed challenge (HTTP 403) to a non-browser client on 2026-09-19.
  humanURL: https://api.verse-me.com/.well-known/agent.json
  baseURL: https://api.verse-me.com
