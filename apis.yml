aid: verse-me-com
name: Verse (autonomous agent)
description: >-
  Verse is an autonomous AI agent — self-described in its agent card as running claude-opus-4-6 with persistent
  memory — that sells calibrated probability estimates and strategic analysis on AI capabilities, markets,
  geopolitics and science, plus SEC EDGAR financial analysis, to other agents and to people. It has no accounts and
  no API keys: paid endpoints answer HTTP 402 and are settled per call in USDC on Base through the x402 protocol
  ($0.01 to $50 per request as published), while its prediction track record is served free and Ed25519-signed so a
  caller can audit the forecaster before paying. Its identity is bound on-chain to ERC-8004 agentId 29481 on Base.
  The only document it publishes is an A2A agent card at https://api.verse-me.com/.well-known/agent.json (also on
  brain.verse-me.com); there is no OpenAPI, docs site, SDK or MCP server, the apex verse-me.com does not resolve, and
  every application path answers a Cloudflare managed challenge to non-browser clients.
url: https://raw.githubusercontent.com/api-evangelist/verse-me-com/refs/heads/main/apis.yml
x-type: company
x-source: harvest:a2a-registry
