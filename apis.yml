apis:
- aid: verse-me-com:verse-a2a-agent
  name: Verse A2A Agent
  description: >-
    Agent2Agent surface declared by the card at https://api.verse-me.com/.well-known/agent.json (version 2.0.0,
    A2A 1.0 shape: supportedInterfaces[0] JSONRPC at https://api.verse-me.com, protocolVersion 1.0) advertising seven
    skills — three free calibration/track-record skills and four paid ones (consultation $3–$50, strategy
    recommendation, epistemic audit, EDGAR financial intelligence $0.01–$0.25) — gated by an x402 payment scheme
    rather than any credential. Declares the AGP capability-announcement extension, an ERC-8004 on-chain identity
    binding and Ed25519-signed outputs; streaming and push notifications off. Graded flavored by the catalog's A2A
    grader (protocolVersion is inside supportedInterfaces, not top-level). The JSON-RPC responder could not be
    exercised: the interface URL answers a Cloudflare managed challenge to non-browser clients.
  humanURL: https://api.verse-me.com/.well-known/agent.json
  baseURL: https://api.verse-me.com
