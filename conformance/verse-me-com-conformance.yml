summary: >-
  Verse's conformance profile is the agent-commerce protocol stack, read from the one document it publishes: an
  A2A agent card in the 1.0 shape (graded flavored by the catalog grader for carrying protocolVersion inside
  supportedInterfaces rather than at the top level), the x402 HTTP payment protocol as its only credential
  (USDC on Base, CAIP-2 eip155:8453, facilitator openfacilitator.io), an ERC-8004 on-chain agent identity that
  was verified by reading the Base registry contract, the AGP capability-announcement extension, JSON-RPC 2.0 as
  the declared A2A binding, and Ed25519-signed outputs as a provenance mechanism. It declares no OAuth/OIDC, no
  RFC 9457 problem details, no security.txt, no API catalog and no APIs.json. Everything marked "declared" below
  is the card's own statement; the endpoints that would confirm the x402 challenge, the JSON-RPC responder and the
  signed calibration data all sit behind a Cloudflare managed challenge for non-browser clients and were not
  observed.
standards:
- id: a2a
  name: Agent2Agent protocol
  version: '1.0'
  conforms: true
  grade: flavored
  evidence: >-
    a2a/verse-me-com-agent-card.json — supportedInterfaces[0] {url https://api.verse-me.com, protocolBinding JSONRPC,
    protocolVersion "1.0"}, capabilities object, skills[] of 7, securitySchemes/securityRequirements,
    defaultInputModes/defaultOutputModes. Card served at the legacy /.well-known/agent.json on two hosts. Catalog
    grader verdict: flavored (no top-level protocolVersion). JSON-RPC responder not exercised (edge challenge).
- id: x402
  name: x402 HTTP payment protocol
  conforms: true
  verification: declared
  domain_standard_signature: true
  evidence: >-
    Card securitySchemes.x402Payment (httpAuthSecurityScheme scheme "x402": "Client receives 402 response with payment
    requirements, pays onchain (Base USDC), retries with payment receipt header"); urn:verse:agent-extensions:v1
    protocols.x402 {version 1.0, role resourceServer, network eip155:8453, asset USDC, assetContract
    0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913, facilitator https://openfacilitator.io, payTo
    0x1060D0B596685Ff429BD64f41611f5D1d15f1659}; the card response itself exposes CORS headers PAYMENT-REQUIRED /
    PAYMENT-RESPONSE and allows request headers PAYMENT-SIGNATURE / X-PAYMENT.
  note: >-
    The 402 challenge was NOT observed: POST https://api.verse-me.com/expertise/consultation with a JSON question
    (and no payment) returned the Cloudflare managed challenge (403, cf-mitigated: challenge), never reaching the
    origin. Recorded as conforming on the provider's own declaration, unverified live. Verse is not listed on
    x402-list.com (25 services, checked 2026-09-19).
