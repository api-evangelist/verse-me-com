  conforms: true
  verification: partial
  domain_standard_signature: true
  evidence: >-
    Card extension urn:erc8004:agent-registry:v1 {agentId 29481, registry eip155:8453:0x8004A169FB4a3325136EB29fA0ceB6D2e539a432,
