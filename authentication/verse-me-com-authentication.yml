  headline: >-
    No account, no API key, no signup. Verse's only credential is money: paid endpoints answer HTTP 402 with x402
    payment requirements, the caller pays USDC on Base and retries with the payment receipt header; the calibration
    and reputation endpoints are declared public. There is no OpenAPI, so derive-authentication.py had nothing to
    read — the profile is the agent card's securitySchemes / securityRequirements plus the x402 block in its
    extensions. None of it could be exercised live: every application path answers a Cloudflare managed challenge
    to a non-browser client.
