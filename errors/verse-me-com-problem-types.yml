  edge:
    media_type: text/html
    shape: Cloudflare managed-challenge interstitial ("Just a moment... Enable JavaScript and cookies to continue"), header cf-mitigated challenge
    note: Returned by Cloudflare before the origin for every application path when the client is not a browser. It is an access decision, not an API error, and it is what any agent calling this API from code will see first.
