consistency_gap: >-
  No error reference is published. The card documents exactly one error-shaped interaction — the 402 payment
  challenge — and nothing about validation errors, unknown domains, payment verification failures or async task
  states. Because the edge challenge intercepts every application request from a non-browser client, the origin's
  real 4xx/5xx envelope for those paths could not be observed; this catalog is limited to what was actually met.
