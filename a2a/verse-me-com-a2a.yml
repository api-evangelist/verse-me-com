surface_relationship:
  note: >-
    Verse publishes one host, one card, and no other contract. The seven A2A skills map onto the REST paths the
    card's urn:verse:agent-extensions:v1 block lists (GET /expertise/calibration, /calibration/signed,
    /calibration/history, /calibration/history/signed, /reputation; POST /expertise/consultation, /expertise/edgar,
    /expertise/epistemic-audit; POST /expertise/consultation/price-estimate), all on api.verse-me.com. The card
    declares MCP with role "client" — Verse consumes MCP, it does not serve an MCP endpoint — so no mcp/ artifact
    is written. There is no OpenAPI, no docs site, no SDK on a registry (the card names examples/verse_client.py and
    examples/verse-client.js in an unpublished repository), and every application path is behind a Cloudflare
    managed challenge for non-browser clients, which is the wall this profile hit.
