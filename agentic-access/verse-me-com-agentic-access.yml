  no published refund path, so paid operations are rated physical with human-in-the-loop required and a token TTL
  ceiling of 300s; the free calibration/reputation reads are connected/read. TTL ceilings mirror the agentic-access
  Spectral ruleset. A governance starting point, not a provider claim; audience is left null to bind per deployment.
  See research/curity/agentic-governance/.
