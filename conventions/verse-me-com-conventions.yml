media_type: application/json (REST paths named in the card; A2A JSON-RPC declared at the host root); text/markdown as a declared output mode
surface_note: >-
  Verse publishes a single document — its A2A agent card — and no OpenAPI, docs site, terms or changelog. Every
  convention below is what that card states, plus what the edge returned to live probes. Where the card is silent
  the value is an honest undocumented/none, not a guess. The host answers a Cloudflare managed challenge to every
  application request from a non-browser client, so nothing here was confirmed against a real response.
auth:
  style: x402 payment (HTTP 402 -> pay USDC on Base -> retry with receipt) on paid endpoints; none on calibration/reputation reads
  detail: authentication/verse-me-com-authentication.yml
idempotency:
  supported: false
  coverage: none
  mechanism: null
  header: null
  scope: []
  retention: undocumented
  description: >-
    No idempotency key, request id or replay-protection mechanism is documented for the paid POSTs
    (/expertise/consultation, /expertise/edgar, /expertise/epistemic-audit). The x402 payment receipt is bound to one
    payment, which prevents the same payment being spent twice, but nothing states whether resubmitting the same
    question with a new payment is deduplicated. Coverage none.
dry_run_mode:
  supported: true
  grade: documented
  operation: POST /expertise/consultation/price-estimate
  description: >-
    A free price preview exists before any payment: the card lists "Price estimate — POST
    /expertise/consultation/price-estimate — Preview cost before paying" among its freeEndpoints, and the consultation
    skill says "Use POST /expertise/consultation/price-estimate for a preview." It rehearses the cost, not the answer.
    Not observed live (edge challenge).
reversibility:
  grade: none
  write_surfaces:
  - surface: POST /expertise/consultation (x402 payment $3–$50 USDC)
    reversal: undocumented
    window: undocumented
  - surface: POST /expertise/epistemic-audit (x402 payment)
    reversal: undocumented
    window: undocumented
  - surface: POST /expertise/edgar (x402 payment $0.01–$0.25 USDC)
    reversal: undocumented
    window: undocumented
  description: >-
    Every write is a purchase settled on-chain in USDC, and the card states no refund, cancel or dispute path and no
    window. On-chain settlement is final by construction unless the provider publishes a refund mechanism, and none
    is published. Graded none rather than na because a paid write surface exists. The only mitigation the provider
    offers is the free price-estimate dry run before paying.
